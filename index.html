<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraculous: Yıldız Avı</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff1744, #b71c1c);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            overflow: hidden;
            touch-action: none;
        }
        h1 {
            margin: 5px;
            font-size: 24px;
            text-shadow: 2px 2px #000;
        }
        #game-container {
            width: 320px;
            height: 450px;
            background: rgba(0, 0, 0, 0.4);
            border: 4px solid #ffd700;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        #player {
            width: 50px;
            height: 50px;
            background: #ffeb3b;
            border-radius: 50%;
            position: absolute;
            bottom: 20px;
            left: 135px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .item {
            width: 35px;
            height: 35px;
            position: absolute;
            top: -40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        #score {
            font-size: 20px;
            margin-top: 10px;
            font-weight: bold;
            text-shadow: 1px 1px #000;
        }
        #controls {
            margin-top: 15px;
            display: flex;
            gap: 20px;
        }
        button.ctrl-btn {
            background: #ffd700;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            color: #b71c1c;
            box-shadow: 0 4px #ffa000;
            cursor: pointer;
        }
        button.ctrl-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #ffa000;
        }
    </style>
</head>
<body>

    <h1>Miraculous: Yıldız Avı</h1>
    <div id="score">Skor: 0</div>

    <div id="game-container">
        <div id="player">🐞</div>
    </div>

    <div id="controls">
        <button class="ctrl-btn" onclick="moveLeft()">◀</button>
        <button class="ctrl-btn" onclick="moveRight()">▶</button>
    </div>

    <script>
        const player = document.getElementById("player");
        const gameContainer = document.getElementById("game-container");
        const scoreDisplay = document.getElementById("score");

        let playerX = 135;
        let score = 0;
        let gameWidth = 320;

        function moveLeft() {
            playerX -= 25;
            if (playerX < 0) playerX = 0;
            player.style.left = playerX + "px";
        }

        function moveRight() {
            playerX += 25;
            if (playerX > gameWidth - 50) playerX = gameWidth - 50;
            player.style.left = playerX + "px";
        }

        // Dokunmatik ve klavye kontrolleri
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") moveLeft();
            if (e.key === "ArrowRight") moveRight();
        });

        function createStar() {
            const star = document.createElement("div");
            star.classList.add("item");
            star.innerHTML = "⭐";
            
            let starX = Math.floor(Math.random() * (gameWidth - 35));
            star.style.left = starX + "px";
            star.style.top = "0px";
            gameContainer.appendChild(star);

            let fallInterval = setInterval(() => {
                let starTop = parseInt(star.style.top);
                star.style.top = (starTop + 4) + "px";

                // Yakalama kontrolü
                if (starTop > 370 && starTop < 420 && Math.abs(starX - playerX) < 35) {
                    score += 10;
                    scoreDisplay.innerText = "Skor: " + score;
                    star.remove();
                    clearInterval(fallInterval);
                }

                // Yere düşerse yok et
                if (starTop > 450) {
                    star.remove();
                    clearInterval(fallInterval);
                }
            }, 30);
        }

        setInterval(createStar, 1000);
    </script>
</body>
</html>
