<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miraculous: Brawl Stars</title>
    <style>
        body {
            margin: 0; padding: 0; background: #0b0f19;
            font-family: 'Arial', sans-serif; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; color: white; overflow: hidden; touch-action: none;
        }
        .screen { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 400px; }
        .hidden { display: none !important; }
        h1 { color: #facc15; margin: 5px; font-size: 22px; text-shadow: 2px 2px #ef4444; text-align: center; }
        
        .btn {
            background: #ef4444; color: white; border: none; padding: 12px 24px;
            font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; margin: 6px;
            box-shadow: 0 4px #b91c1c; width: 85%; text-align: center;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 #b91c1c; }
        input { padding: 10px; border-radius: 8px; border: none; font-size: 15px; margin: 5px; text-align: center; width: 80%; background: #1e293b; color: white; }

        .skin-card {
            background: #1e293b; border: 2px solid #334155; border-radius: 12px;
            padding: 10px; margin: 6px; width: 85%; display: flex; align-items: center; justify-content: space-between; cursor: pointer;
        }
        .skin-card.selected { border-color: #facc15; background: #334155; }

        /* BRAWL STARS HARİTA ALANI */
        #game-container {
            width: 360px; height: 460px; background: #2e1065;
            border: 4px solid #facc15; border-radius: 16px;
            position: relative; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        .wall {
            position: absolute; background: #6b21a8; border: 2px solid #581c87; border-radius: 4px;
        }
        .bush {
            position: absolute; background: #166534; border-radius: 8px; opacity: 0.95;
        }
        .entity {
            width: 34px; height: 34px; position: absolute;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            transition: opacity 0.2s;
        }
        .box {
            width: 30px; height: 30px; background: #78350f; border: 2px solid #451a03;
            position: absolute; display: flex; align-items: center; justify-content: center;
            font-size: 9px; font-weight: bold; color: white; border-radius: 4px; cursor: pointer;
        }
        .projectile {
            width: 10px; height: 10px; background: #facc15; border-radius: 50%;
            position: absolute; box-shadow: 0 0 8px #facc15;
        }
        #controls-area {
            margin-top: 8px; display: flex; width: 360px; justify-content: space-between; align-items: center; padding: 0 5px;
        }
        .d-pad { display: grid; grid-template-columns: repeat(3, 44px); gap: 3px; }
        .ctrl-btn {
            background: rgba(250, 204, 21, 0.3); border: 2px solid #facc15; width: 44px; height: 44px;
            font-size: 16px; font-weight: bold; border-radius: 10px; color: white;
            display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn:active { background: rgba(250, 204, 21, 0.7); }
        .action-btns { display: flex; gap: 12px; align-items: center; }
        .attack-btn { background: #ef4444; color: white; width: 62px; height: 62px; border-radius: 50%; font-size: 24px; border: 3px solid #f87171; box-shadow: 0 4px #991b1b; }
        .super-btn { background: #eab308; color: white; width: 48px; height: 48px; border-radius: 50%; font-size: 18px; border: 3px solid #fef08a; box-shadow: 0 3px #854d0e; }
    </style>
</head>
<body>

    <div id="menu-screen" class="screen">
        <h1>Miraculous: Hesaplaşma</h1>
        <input type="text" id="friend-input" placeholder="Arkadaşının Kullanıcı Adı">
        <button class="btn" onclick="addFriend()">Arkadaş Ekle</button>
        <p id="friend-status" style="color: #4ade80; font-size: 13px; margin: 2px;"></p>

        <select id="mode-select" style="padding: 10px; border-radius: 8px; font-size: 15px; margin: 8px; width: 85%; background: #1e293b; color: white;">
            <option value="solo">Tek Hesaplaşma</option>
            <option value="duo">Çift Hesaplaşma (+ Chat Noir Bot)</option>
        </select>
        <button class="btn" style="background:#22c55e; box-shadow: 0 4px #15803d;" onclick="goToSkinSelect()">DEVAM ET</button>
    </div>

    <div id="skin-screen" class="screen hidden">
        <h1>Miraculous Karakteri Seç</h1>
        <div class="skin-card selected" onclick="selectSkin('🐞', 0, this)">
            <span>🐞 Ladybug (Klasik)</span>
            <span>Ücretsiz</span>
        </div>
        <div class="skin-card" onclick="selectSkin('🐅', 29, this)">
            <span>🐅 Kaplan Böcek</span>
            <span>29 💎</span>
        </div>
        <div class="skin-card" onclick="selectSkin('🐈‍⬛', 149, this)">
            <span>🐈‍⬛ Cat Walker</span>
            <span>149 💎</span>
        </div>
        <button class="btn" style="background:#3b82f6; box-shadow: 0 4px #1d4ed8; margin-top: 15px;" onclick="startGame()">OYUNA BAŞLA</button>
    </div>

    <div id="game-screen" class="screen hidden">
        <div style="display: flex; justify-content: space-between; width: 360px; font-size: 13px; font-weight: bold; margin-bottom: 4px;">
            <span id="score-display">Kalan savaşçı: 10 | Yük: 0 🔋</span>
            <span id="mode-label" style="color: #facc15;">Tek</span>
        </div>

        <div id="game-container">
            <div class="wall" style="width: 50px; height: 30px; top: 80px; left: 40px;"></div>
            <div class="wall" style="width: 30px; height: 60px; top: 150px; left: 200px;"></div>
            <div class="wall" style="width: 70px; height: 25px; top: 300px; left: 100px;"></div>

            <div class="bush" style="width: 90px; height: 80px; top: 30px; left: 20px;"></div>
            <div class="bush" style="width: 100px; height: 90px; top: 330px; left: 230px;"></div>
            
            <div class="box" id="box1" style="top: 210px; left: 164px;" onclick="hitBox()">15HP</div>

            <div class="entity" id="enemy" style="top: 30px; left: 300px;" title="Akumalı">🦹‍♂️</div>

            <div class="entity" id="player" style="top: 400px; left: 160px;">🐞</div>
        </div>

        <div id="controls-area">
            <div class="d-pad">
                <div></div><button class="ctrl-btn" onclick="move('up')">▲</button><div></div>
                <button class="ctrl-btn" onclick="move('left')">◀</button>
                <button class="ctrl-btn" onclick="move('down')">▼</button>
                <button class="ctrl-btn" onclick="move('right')">▶</button>
            </div>
            <div class="action-btns">
                <button class="super-btn" onclick="useSuper()">⚡</button>
                <button class="attack-btn" onclick="attack()">🔴</button>
            </div>
        </div>
    </div>

    <script>
        let selectedSkinIcon = '🐞';
        let playerX = 160, playerY = 400;
        let enemyX = 300, enemyY = 30;
        let powerCube = 0;
        let playerHp = 100;
        let boxHp = 15;
        let isHidden = false;
        let duoMode = false;
        let botObj = null;
        let brawlersLeft = 10;

        function addFriend() {
            let name = document.getElementById("friend-input").value;
            if(name) {
                document.getElementById("friend-status").innerText = name + " arkadaş eklendi! ✅";
            }
        }

        function goToSkinSelect() {
            let mode = document.getElementById("mode-select").value;
            duoMode = (mode === "duo");
            document.getElementById("menu-screen").classList.add("hidden");
            document.getElementById("skin-screen").classList.remove("hidden");
        }

        function selectSkin(icon, price, element) {
            selectedSkinIcon = icon;
            document.querySelectorAll('.skin-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
        }

        function startGame() {
            document.getElementById("skin-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            document.getElementById("mode-label").innerText = duoMode ? "Çift" : "Tek";
            
            let p = document.getElementById("player");
            p.innerText = selectedSkinIcon;

            if(duoMode) {
                botObj = document.createElement("div");
                botObj.className = "entity";
                botObj.innerHTML = "🐾";
                botObj.style.left = (playerX + 40) + "px";
                botObj.style.top = playerY + "px";
                document.getElementById("game-container").appendChild(botObj);
            }

            setInterval(updateEnemy, 450);
        }

        function move(dir) {
            let nextX = playerX, nextY = playerY;
            let step = 14;

            if(dir === 'left') nextX -= step;
            if(dir === 'right') nextX += step;
            if(dir === 'up') nextY -= step;
            if(dir === 'down') nextY += step;

            if(nextX < 0 || nextX > 326 || nextY < 0 || nextY > 426) return;

            // Duvar engelleri
            if(nextX > 30 && nextX < 95 && nextY > 70 && nextY < 115) return;
            if(nextX > 190 && nextX < 235 && nextY > 140 && nextY < 215) return;
            if(nextX > 90 && nextX < 175 && nextY > 290 && nextY < 330) return;

            playerX = nextX;
            playerY = nextY;

            let p = document.getElementById("player");
            p.style.left = playerX + "px";
            p.style.top = playerY + "px";

            // Çalı görünmezliği
            if((playerX > 10 && playerX < 110 && playerY > 20 && playerY < 115) || 
               (playerX > 220 && playerX < 330 && playerY > 320 && playerY < 425)) {
                p.style.opacity = "0.25";
                isHidden = true;
            } else {
                p.style.opacity = "1";
                isHidden = false;
            }
        }

        function hitBox() {
            boxHp -= (5 + (powerCube * 2));
            let box = document.getElementById("box1");
            if(boxHp <= 0) {
                box.remove();
                powerCube++;
                brawlersLeft = Math.max(2, brawlersLeft - 1);
                document.getElementById("score-display").innerText = `Kalan savaşçı: ${brawlersLeft} | Yük: ${powerCube} 🔋`;
            } else {
                box.innerText = boxHp + "HP";
            }
        }

        function attack() {
            let proj = document.createElement("div");
            proj.className = "projectile";
            proj.style.left = (playerX + 12) + "px";
            proj.style.top = playerY + "px";
            document.getElementById("game-container").appendChild(proj);

            let pTimer = setInterval(() => {
                let t = parseInt(proj.style.top);
                proj.style.top = (t - 22) + "px";

                let eDist = Math.abs(parseInt(proj.style.left) - enemyX);
                let eTop = parseInt(proj.style.top);
                if(eDist < 30 && eTop < enemyY + 30) {
                    let enemyEl = document.getElementById("enemy");
                    enemyEl.style.filter = "brightness(3)";
                    setTimeout(() => enemyEl.style.filter = "none", 150);
                    proj.remove();
                    clearInterval(pTimer);
                }

                if(t < 0) {
                    proj.remove();
                    clearInterval(pTimer);
                }
            }, 25);
        }

        function useSuper() {
            // Süper güç efekti (Hızlı atış veya özel hamle)
            powerCube += 1;
            document.getElementById("score-display").innerText = `Kalan savaşçı: ${brawlersLeft} | Yük: ${powerCube} 🔋`;
        }

        function updateEnemy() {
            if(isHidden) return; // Çalıdayken düşman göremez

            if(enemyX < playerX) enemyX += 7;
            if(enemyX > playerX) enemyX -= 7;
            if(enemyY < playerY) enemyY += 7;
            if(enemyY > playerY) enemyY -= 7;

            let enemyEl = document.getElementById("enemy");
            enemyEl.style.left = enemyX + "px";
            enemyEl.style.top = enemyY + "px";

            if(Math.abs(enemyX - playerX) < 25 && Math.abs(enemyY - playerY) < 25) {
                playerHp -= 15;
                if(playerHp <= 0) {
                    alert("Yenildin! Tekrar başlıyor...");
                    location.reload();
                }
            }
        }
    </script>
</body>
</html>
